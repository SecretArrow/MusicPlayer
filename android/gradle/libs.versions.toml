[versions]
agp = "8.7.2"
kotlin = "2.0.21"
composeBom = "2024.12.01"
media3 = "1.5.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
uniffi = "0.28"
coil = "2.7.0"
navigationCompose = "2.8.5"
