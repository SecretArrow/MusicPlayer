name: CI — Android native app (Kotlin + Rust + Media3 + Android Auto)

# ──────────────────────────────────────────────────────────────────────────
# Push-triggered auto-release loop (per user request: "hapus semua
# penjadwalan, kerjakan tugas langsung saja, rilis app setiap selesai").
#
#   push to main
#       │
#       ▼
#   ci-android.yml ── build + sign split-per-ABI APK + AAB ── publish `edge-android`
#                                       │
#                                       ▼
#                              smoke-test.yml  (workflow_run trigger)
#                                       │
#                       pass ── done    │ fail
#                                       ▼
#                              fix-loop.yml  (auto_fix.py --commit)
#                                       │
#                  patches applied ─────┼──── no pattern matched
#                                       │            │
#                                       ▼            ▼
#                                  push commit    open issue
#                                       │
#                                       ▼
#                                  re-triggers ci-android
#                                       │
#                                  ─── loop on demand ───
#
# This file owns: push trigger + build + sign + edge-android release.
# There is no schedule (cron) trigger — every release is driven by a
# real push. Companion files: smoke-test.yml, fix-loop.yml,
# scripts/smoke_test.py, scripts/auto_fix.py.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'shared/audio-core/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'android/**'
      - 'shared/audio-core/**'
      - '.github/workflows/ci-android.yml'
  workflow_dispatch:

# Cancel stale in-flight builds for the same ref (branch/tag) on new pushes.
concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  build:
    name: Build APK & AAB (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Surface signing readiness to the downstream `release` job: runs
    # without the keystore secrets must NOT publish an empty release.
    outputs:
      signing_ready: ${{ steps.detect_signing.outputs.signing_ready }}
    steps:
      - uses: actions/checkout@v4

      # `if:` conditions cannot reference `secrets.*` directly (the context is
      # not allowed there), so we materialize the check into an env var that
      # later steps can test via `env.SIGNING_READY`, and expose it as a job
      # output for the release job.
      - name: Detect signing secrets
        id: detect_signing
        env:
          ANDROID_KEYSTORE_ZIP_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_ZIP_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_ZIP_PASSWORD" ]; then
            echo "SIGNING_READY=yes" >> "$GITHUB_ENV"
            echo "signing_ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "SIGNING_READY=no" >> "$GITHUB_ENV"
            echo "signing_ready=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # Ubuntu runners ship a preinstalled Android SDK (cmdline-tools 20.0)
      # at $ANDROID_HOME. android-actions/setup-android@v3 currently fails on
      # its internal license prompt, so configure the preinstalled SDK directly.
      - name: Install Android SDK packages
        run: |
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-35" \
            "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # This repo is a cargo workspace rooted at the repository root, so
          # every crate (shared/audio-core, android/rust) shares <root>/target.
          # Cache that target dir plus the shared cargo registry.
          workspaces: "."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Configure NDK linker environment
        run: |
          # Plain `cargo build --target <android-triple>` needs the NDK clang
          # wrappers as custom linkers. setup-android installed the NDK under
          # $ANDROID_HOME/ndk/<version>; pick the newest and export one linker
          # env var per Rust target triple (API level 24 == app minSdk).
          NDK_ROOT="${ANDROID_NDK_ROOT:-$(ls -1d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)}"
          if [ ! -d "$NDK_ROOT" ]; then
            echo "::error::No Android NDK found under $ANDROID_HOME/ndk"
            exit 1
          fi
          echo "Using NDK: $NDK_ROOT"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=24
          {
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android${API}-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/armv7a-linux-androideabi${API}-clang"
            echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$TOOLCHAIN/i686-linux-android${API}-clang"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/x86_64-linux-android${API}-clang"
          } >> "$GITHUB_ENV"

      - name: Test shared audio-core
        working-directory: shared/audio-core
        run: cargo test --no-default-features --features decoder,metadata,effects --no-fail-fast

      # Build the UniFFI bridge crate (android/rust), which links audio-core,
      # as a cdylib for every ABI the app ships. Linkers come from the
      # "Configure NDK linker environment" step. No `|| true` here: a failed
      # ABI build must fail the job (the verify step below also enforces it).
      - name: Build Rust Android libraries (all ABIs)
        working-directory: android/rust
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            cargo build --release --target "$target"
          done

      # Runs cargo-ndk (or plain cargo + NDK linkers) for aarch64 and invokes
      # `uniffi-bindgen generate --library ... --language kotlin` in library
      # mode. Produces android/app/src/main/kotlin/uniffi/musicplayer/*.kt,
      # which Gradle picks up automatically for all following build steps.
      - name: Generate UniFFI Kotlin bindings
        working-directory: android/rust
        env:
          ANDROID_API_LEVEL: '24'
        run: |
          # The aarch64 cdylib was just built above — skip the redundant build.
          SKIP_BUILD=1 ./generate-bindings.sh

      # Fail loudly if any of the 4 ABIs is missing its cdylib.
      - name: Verify Rust Android libs exist
        run: |
          status=0
          for target in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            libs=$(ls target/$target/release/*.so 2>/dev/null || true)
            if [ -z "$libs" ]; then
              echo "::error::No .so produced for $target (expected target/$target/release/*.so)"
              status=1
            else
              echo "$target:"
              echo "$libs" | sed 's/^/  /'
            fi
          done
          exit $status

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Lint
        # OPTIMIZATION: only run on PRs, tagged releases, and manual
        # dispatches — skip on plain pushes to main. Lint is ~85s per run
        # and rarely surfaces new issues on a clean tree; running it on
        # the rolling edge tick wastes runner time without catching
        # anything new. PRs and tagged releases still gate on it before
        # anything is published.
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: android
        run: ./gradlew lintDebug --continue || true

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --continue || true

      - name: Assemble debug APK (universal)
        working-directory: android
        run: ./gradlew assembleDebug

      # Decode the keystore archive BEFORE gradle builds: prefer the
      # ANDROID_KEYSTORE_ARCHIVE secret (base64-encoded zip), fall back to the
      # repo path android/key-sign-apk.zip. Contents are never echoed —
      # extracted into android/.signing and exported as KS_FILE so Gradle
      # natively signs both the split APKs and the AAB.
      - name: Prepare keystore archive
        if: ${{ env.SIGNING_READY == 'yes' }}
        env:
          ANDROID_KEYSTORE_ARCHIVE: ${{ secrets.ANDROID_KEYSTORE_ARCHIVE }}
          ANDROID_KEYSTORE_ZIP_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_ZIP_PASSWORD }}
        run: |
          mkdir -p android/.signing
          if [ -n "$ANDROID_KEYSTORE_ARCHIVE" ]; then
            printf '%s' "$ANDROID_KEYSTORE_ARCHIVE" | base64 --decode > android/key-sign-apk.zip
            echo "Keystore archive decoded from secret ANDROID_KEYSTORE_ARCHIVE."
          elif [ -f android/key-sign-apk.zip ]; then
            echo "Using keystore archive from repository: android/key-sign-apk.zip"
          else
            echo "::error::Signing requested but no keystore archive found. Set the ANDROID_KEYSTORE_ARCHIVE secret (base64) or commit android/key-sign-apk.zip."
            exit 1
          fi
          (cd android/.signing && unzip -o -P "$ANDROID_KEYSTORE_ZIP_PASSWORD" ../key-sign-apk.zip)
          KS_FILE=$(find "$PWD/android/.signing" -name '*.jks' -o -name '*.keystore' | head -1)
          if [ -z "$KS_FILE" ]; then
            echo "::error::Keystore not found inside the archive"
            exit 1
          fi
          echo "KS_FILE=$KS_FILE" >> "$GITHUB_ENV"
          echo "Keystore exported to KS_FILE (path only, never its content)."

      - name: Build per-ABI APKs (split)
        working-directory: android
        run: ./gradlew assembleRelease  # splits.abi config produces per-ABI APKs automatically
        # Gradle's signingConfig "ci" (see android/app/build.gradle.kts) reads
        # KS_FILE (exported by the previous step via GITHUB_ENV), KS_PWD,
        # KEY_ALIAS and KEY_PWD. All three must be present as env vars here
        # or `:app:packageRelease` fails with
        # "SigningConfig 'ci' is missing required property 'storePassword'".
        env:
          KS_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Re-sign & verify split APKs (per-ABI)
        if: ${{ env.SIGNING_READY == 'yes' }}
        working-directory: android
        env:
          KS_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The keystore was already extracted by "Prepare keystore archive"
          # and exported as KS_FILE (absolute path). Gradle signed the APKs
          # with it during assembleRelease; apksigner re-signs and renames
          # each per-ABI APK to musicplayer-<abi>-signed.apk for release.
          if [ -z "$KS_FILE" ] || [ ! -f "$KS_FILE" ]; then
            echo "::error::KS_FILE missing — keystore extraction failed"
            exit 1
          fi
          # AGP with `splits.abi` writes ALL per-ABI APKs into a single
          # directory: app/build/outputs/apk/release/app-<abi>-release.apk
          # (the ABI is encoded in the filename, NOT in the directory name).
          # Parse the ABI out of the filename with sed; nullglob makes an
          # unmatched pattern expand to nothing so apksigner never receives
          # a literal "*.apk" filename.
          shopt -s nullglob
          found=0
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            found=1
            # ABI names include hyphens (arm64-v8a, armeabi-v7a) so the
            # character class must allow them, or sed won't match and the
            # whole filename leaks into the output name.
            abi=$(basename "$apk" | sed -E 's/^app-([a-z0-9_-]+)-release\.apk$/\1/')
            out="$(dirname "$apk")/musicplayer-${abi}-signed.apk"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
              --ks "$KS_FILE" \
              --ks-pass "pass:$KS_PWD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KS_PWD" \
              --out "$out" \
              "$apk"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$out"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No per-ABI release APKs found under app/build/outputs/apk/release/"
            ls -R app/build/outputs/apk/ 2>/dev/null || true
            exit 1
          fi

      - name: Assemble AAB
        working-directory: android
        run: ./gradlew bundleRelease
        # Same signingConfig "ci" as assembleRelease — the AAB is signed
        # natively by Gradle when these env vars are present.
        env:
          KS_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Cleanup signing material
        if: ${{ always() }}
        run: |
          # Never leave signing material on the runner disk.
          shred -u android/key-sign-apk.zip 2>/dev/null || rm -f android/key-sign-apk.zip
          rm -rf android/.signing
          echo "Signing material removed from runner."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: musicplayer-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload per-ABI APKs (signed when keystore present, else unsigned)
        # Always upload release APKs (per user request: "selalu publish
        # release aja"). When the keystore is configured the re-sign step
        # produces `musicplayer-<abi>-signed.apk` (first glob). When it is
        # not, the unsigned AGP output `app-<abi>-release-unsigned.apk`
        # (second glob) is uploaded under the SAME artifact name so the
        # downstream release glob always resolves. The two globs are
        # mutually exclusive by filename, so no duplicates in either case.
        uses: actions/upload-artifact@v4
        with:
          name: musicplayer-android-signed-apks
          path: |
            android/app/build/outputs/apk/release/musicplayer-*-signed.apk
            android/app/build/outputs/apk/release/app-*-release-unsigned.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: musicplayer-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  release:
    name: Publish Android Release
    needs: build
    # ALWAYS publish a release (per user request: "selalu publish release
    # aja"). The only run type we skip is pull_request (publishing a release
    # for an unmerged PR makes no sense and PRs from forks have no access to
    # the release token). Every push to main publishes the rolling
    # `edge-android` release; every tag push publishes a versioned release
    # under the tag name; manual dispatches publish `edge-android`. The
    # build job now always uploads per-ABI APKs (signed when the keystore
    # is configured, unsigned otherwise) so the release always has APKs +
    # AAB regardless of whether signing secrets are present.
    # `softprops/action-gh-release` updates an existing release with the
    # same tag in place, so `edge-android` is overwritten on every push
    # to main with fresh APKs + AAB.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      # Resolve release target: a tag push publishes under its own name
      # (e.g. v0.1.0); a push-to-main / manual run publishes the rolling
      # `edge-android` release. `softprops/action-gh-release` updates an
      # existing release with the same tag in place, so `edge-android` is
      # overwritten on every push to main with fresh signed APKs + AAB.
      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=$( [[ "${GITHUB_REF_NAME}" == *-* ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "kind=versioned" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge-android" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "kind=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.kind == 'edge' && format('MusicPlayer Android — edge ({0})', github.sha) || format('MusicPlayer Android {0}', steps.rel.outputs.tag) }}
          files: |
            artifacts/musicplayer-android-signed-apks/*.apk
            artifacts/musicplayer-android-aab/*.aab
          draft: false
          prerelease: ${{ steps.rel.outputs.prerelease }}
          make_latest: true
          generate_release_notes: false
          body: |
            # MusicPlayer Android ${{ steps.rel.outputs.tag }}

            Native Android music player with shared Rust audio engine,
            Media3 + Android Auto integration, and signed split-per-ABI APKs.
            Built from commit ${{ github.sha }}.

            ${{ steps.rel.outputs.kind == 'edge' && format('This is a **rolling edge** build, refreshed on every push to main by the `push` trigger in `ci-android.yml`. The latest signed APKs and AAB always live here. Source: [`{0}`](https://github.com/SecretArrow/MusicPlayer/commit/{0})', github.sha) || 'Tagged release.' }}

            ## Downloads
            - **arm64-v8a**: `musicplayer-arm64-v8a-signed.apk` — most modern phones
            - **armeabi-v7a**: `musicplayer-armeabi-v7a-signed.apk` — older 32-bit phones
            - **x86_64**: `musicplayer-x86_64-signed.apk` — emulators
            - **x86**: `musicplayer-x86-signed.apk` — emulators (32-bit)
            - **AAB**: `app-release.aab` — Play Store bundle

            See `docs/ANDROID_AUTO.md` for Android Auto setup.
