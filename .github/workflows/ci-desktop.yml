name: CI — Desktop native app (Windows + Linux + macOS)

# ──────────────────────────────────────────────────────────────────────────
# Push-triggered auto-release loop (per user request: "hapus semua
# penjadwalan, kerjakan tugas langsung saja, rilis app setiap selesai").
#
#   push to main
#       │
#       ▼
#   ci-desktop.yml ── build + test ── publish rolling `edge` release
#                                       │
#                                       ▼
#                              smoke-test.yml  (workflow_run trigger)
#                                       │
#                       pass ── done    │ fail
#                                       ▼
#                              fix-loop.yml  (auto_fix.py --commit)
#                                       │
#                  patches applied ─────┼──── no pattern matched
#                                       │            │
#                                       ▼            ▼
#                                  push commit    open issue
#                                       │
#                                       ▼
#                                  re-triggers ci-desktop
#                                       │
#                                  ─── loop on demand ───
#
# This file owns: push trigger + build + edge release. There is no
# schedule (cron) trigger — every release is driven by a real push.
# Companion files: smoke-test.yml, fix-loop.yml, scripts/smoke_test.py,
#                  scripts/auto_fix.py.
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'shared/audio-core/**'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'desktop/**'
      - 'shared/audio-core/**'
      - '.github/workflows/ci-desktop.yml'
  workflow_dispatch:

# Cancel stale in-flight builds for the same ref (branch/tag) on new pushes.
# All runs here share ref `refs/heads/main` (push) or `refs/tags/v*` (tag),
# so a fresh push supersedes the previous run.
concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: musicplayer-desktop-x86_64-windows
            archive_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: musicplayer-desktop-x86_64-linux
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: musicplayer-desktop-aarch64-macos
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install Linux deps (audio/graphics)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libfreetype6-dev libexpat1-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"

      - name: Format check
        working-directory: desktop
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: desktop
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Test shared audio-core
        working-directory: shared/audio-core
        run: cargo test --no-default-features --features decoder,metadata,effects --no-fail-fast

      - name: Test desktop crate
        working-directory: desktop
        run: cargo test --target ${{ matrix.target }} --no-fail-fast

      - name: Build desktop release
        working-directory: desktop
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package portable (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $staging = "musicplayer-desktop-windows-x64"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/musicplayer-desktop.exe" "$staging/"
          if (Test-Path "desktop/assets") {
            Copy-Item -Recurse "desktop/assets/*" "$staging/" -ErrorAction SilentlyContinue
          }
          Copy-Item "README.md" "$staging/"
          Compress-Archive -Path "$staging/*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Package portable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          staging="musicplayer-desktop-linux-x64"
          mkdir -p "$staging"
          cp "target/x86_64-unknown-linux-gnu/release/musicplayer-desktop" "$staging/"
          cp -r desktop/assets/* "$staging/" 2>/dev/null || true
          cp README.md "$staging/"
          tar czf ${{ matrix.artifact_name }}.tar.gz -C "$staging" .

      - name: Package portable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          staging="musicplayer-desktop-macos-arm64"
          mkdir -p "$staging"
          cp "target/aarch64-apple-darwin/release/musicplayer-desktop" "$staging/"
          cp -r desktop/assets/* "$staging/" 2>/dev/null || true
          cp README.md "$staging/"
          tar czf ${{ matrix.artifact_name }}.tar.gz -C "$staging" .

      # Non-blocking smoke test: keep `continue-on-error` so a Wine failure
      # doesn't fail the job, but drop the inner `|| true` so the step's
      # outcome still records the failure — the step below turns it into a
      # visible warning annotation.
      #
      # OPTIMIZATION: only run on tagged releases (refs/tags/v*) and manual
      # dispatches. This step rebuilds the entire desktop crate for the
      # x86_64-pc-windows-gnu target (separate from the msvc build that the
      # windows-latest runner already produces and ships), costing ~130s of
      # Linux runner time per run. Skipping it on push runs keeps the rolling
      # edge loop fast; tagged releases still get the extra verification
      # before a stable version is cut.
      - name: Wine smoke test (Windows binary on Linux runner)
        id: wine
        if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: |
          sudo apt-get install -y wine
          # Cross-build the Windows binary so we can smoke-test it under Wine.
          rustup target add x86_64-pc-windows-gnu
          cd desktop && cargo build --release --target x86_64-pc-windows-gnu

      - name: Warn if Wine smoke test failed
        if: matrix.os == 'ubuntu-latest' && steps.wine.outcome == 'failure'
        run: |
          echo "::warning::Wine smoke test failed — the Windows cross-build was not verified under Wine. This is non-blocking, but should be investigated."
          exit 0

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # ALWAYS publish a release (per user request: "selalu publish release
    # aja"). The only run type we skip is pull_request (publishing a release
    # for an unmerged PR makes no sense and PRs from forks have no access to
    # the release token). Every push to main publishes the rolling `edge`
    # release; every tag push publishes a versioned release under the tag
    # name; manual dispatches publish `edge`. `softprops/action-gh-release`
    # updates an existing release with the same tag in place, so the `edge`
    # release is overwritten on every push to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      # Fail with a clear error if any expected release artifact is missing
      # BEFORE creating the GitHub Release.
      - name: Verify artifacts
        run: |
          status=0
          for f in \
            artifacts/musicplayer-desktop-x86_64-windows/musicplayer-desktop-x86_64-windows.zip \
            artifacts/musicplayer-desktop-x86_64-linux/musicplayer-desktop-x86_64-linux.tar.gz \
            artifacts/musicplayer-desktop-aarch64-macos/musicplayer-desktop-aarch64-macos.tar.gz; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing expected release artifact: $f"
              status=1
            else
              echo "OK: $f"
            fi
          done
          exit $status

      # Resolve release target: a tag push publishes under its own name (e.g.
      # v0.1.0); a push-to-main / manual run publishes the rolling `edge`
      # release. `softprops/action-gh-release` updates an existing release
      # with the same tag in place, so the `edge` release is overwritten on
      # every push to main.
      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=$( [[ "${GITHUB_REF_NAME}" == *-* ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "kind=versioned" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "kind=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.kind == 'edge' && format('MusicPlayer Desktop — edge ({0})', github.sha) || format('MusicPlayer Desktop {0}', steps.rel.outputs.tag) }}
          files: |
            artifacts/musicplayer-desktop-x86_64-windows/*.zip
            artifacts/musicplayer-desktop-x86_64-linux/*.tar.gz
            artifacts/musicplayer-desktop-aarch64-macos/*.tar.gz
          draft: false
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: false
          body: |
            # MusicPlayer Desktop ${{ steps.rel.outputs.tag }}

            Native desktop music player for Windows, Linux, and macOS.
            Built from commit ${{ github.sha }}.

            ${{ steps.rel.outputs.kind == 'edge' && format('This is a **rolling edge** build, refreshed on every push to main by the `push` trigger in `ci-desktop.yml`. The latest binaries always live here. Source: [`{0}`](https://github.com/SecretArrow/MusicPlayer/commit/{0})', github.sha) || 'Tagged release. See `docs/ARCHITECTURE.md` for technical details.' }}

            ## Downloads
            - **Windows x64**: `musicplayer-desktop-x86_64-windows.zip` — extract and run `musicplayer-desktop.exe`
            - **Linux x64**: `musicplayer-desktop-x86_64-linux.tar.gz` — extract and `./musicplayer-desktop`
            - **macOS arm64**: `musicplayer-desktop-aarch64-macos.tar.gz` — extract and `./musicplayer-desktop`

            See `docs/ARCHITECTURE.md` for technical details.
