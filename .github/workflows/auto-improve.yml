name: Auto Improve — scheduled polish sweep (fmt, clippy --fix)

# ──────────────────────────────────────────────────────────────────────────
# The user's standing request (quoted in ci-desktop.yml / ci-android.yml):
# "auto test semua fitur, auto uji semua fitur app, auto fix, auto release
# app + android apk signed split per abi, auto sempurnakan".
#
# The repo already owns the reactive half of that loop:
#
#   schedule (0,30 * * * *) → ci-desktop / ci-android (build + test +
#   signed split-per-ABI APK release) → smoke-test.yml → fix-loop.yml
#   (auto_fix.py patches known failures → push → CI re-runs → loop).
#
# This file owns the missing PROACTIVE half: a daily mechanical polish
# sweep that improves the code even when nothing is broken:
#
#   1. cargo fmt --all                → normalizes formatting drift
#   2. cargo clippy --fix             → applies safe clippy suggestions
#   3. validate: fmt --check, clippy -D warnings, cargo test per crate
#   4. changed AND green  → commit "chore(auto-improve): ..." + push.
#                           The push re-triggers ci-desktop + ci-android,
#                           so a fresh signed edge release ships with the
#                           improvement.
#      changed but RED     → git reset --hard (never push broken polish)
#      unchanged           → no-op
#
# Safety (mirrors fix-loop.yml philosophy):
#   - Only mechanical rewrites: rustfmt output and machine-applied clippy
#     suggestions. No dependency bumps, no API changes, no deletions of
#     user logic.
#   - Every candidate change must pass the same gates as ci-desktop
#     (fmt, clippy -D warnings, tests) before it is pushed.
#   - Uses the built-in GITHUB_TOKEN to push. No PAT, no secrets.
# ──────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Daily at 21:30 UTC = 04:30 WIB (Asia/Jakarta). Quiet hours, and far
    # enough from the 30-minute edge-release ticks that CI slots stay free.
    - cron: '30 21 * * *'
  workflow_dispatch:

concurrency:
  group: auto-improve-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  polish:
    name: fmt + clippy --fix → validate → push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux deps (audio/graphics, same as ci-desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libfreetype6-dev libexpat1-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Configure git identity
        run: |
          git config user.name  "musicplayer-auto-improve[bot]"
          git config user.email "auto-improve@musicplayer.local"

      # ── 1. Apply mechanical improvements ────────────────────────────────
      - name: "cargo fmt --all (desktop, audio-core, android/rust)"
        run: |
          cargo fmt --all
          (cd desktop && cargo fmt --all)
          (cd shared/audio-core && cargo fmt --all)
          (cd android/rust && cargo fmt --all)

      - name: cargo clippy --fix (apply safe suggestions, per crate)
        run: |
          set +e
          # --allow-dirty/--allow-no-vcs: fmt already modified the tree, and
          # clippy --fix refuses to run on a dirty VCS by default.
          for d in shared/audio-core desktop android/rust; do
            (cd "$d" && cargo clippy --fix --allow-dirty --allow-no-vcs --all-targets)
            echo "clippy-fix $d exit=$?"
          done
          exit 0

      # ── 2. Anything to push? ────────────────────────────────────────────
      - name: Detect changes
        id: changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to improve — tree already clean."
          fi

      # ── 3. Validate with the same gates as ci-desktop (ubuntu) ──────────
      - name: Validate (fmt --check, clippy -D warnings, tests)
        id: validate
        if: steps.changed.outputs.changed == 'true'
        run: |
          set +e
          FAIL=0
          log() { echo "### $*"; }

          log "cargo fmt --check"
          cargo fmt --all -- --check || FAIL=1

          log "clippy audio-core"
          (cd shared/audio-core && cargo clippy --all-targets -- -D warnings) || FAIL=1

          log "clippy desktop"
          (cd desktop && cargo clippy --all-targets -- -D warnings) || FAIL=1

          log "clippy android/rust"
          (cd android/rust && cargo clippy --all-targets -- -D warnings) || FAIL=1

          log "test audio-core (decoder,metadata,effects)"
          (cd shared/audio-core && \
            cargo test --no-default-features --features decoder,metadata,effects \
            --no-fail-fast) || FAIL=1

          log "test desktop"
          (cd desktop && cargo test --no-fail-fast) || FAIL=1

          log "check android/rust (host target — SDK/NDK lives only in CI)"
          (cd android/rust && cargo check) || FAIL=1

          echo "validate_fail=$FAIL" >> "$GITHUB_OUTPUT"
          exit $FAIL

      # ── 4a. Green → commit + push (re-triggers release automation) ──────
      - name: Commit and push improvements
        if: steps.changed.outputs.changed == 'true' && steps.validate.outputs.validate_fail == '0'
        run: |
          git add -A
          git commit -m \
            "chore(auto-improve): scheduled fmt + clippy polish sweep [skip ci]" \
            -m "Mechanical improvements applied by auto-improve.yml: rustfmt \
                normalization and safe clippy --fix suggestions across \
                shared/audio-core, desktop and android/rust. Validated with \
                fmt --check, clippy -D warnings and cargo test before push."
          git push origin HEAD

      # ── 4b. Red → revert, never push broken polish ──────────────────────
      - name: Revert (validation failed — nothing pushed)
        if: steps.changed.outputs.changed == 'true' && steps.validate.outputs.validate_fail != '0'
        run: |
          git reset --hard HEAD
          git clean -fd
          echo "::warning::Auto-improve produced changes that failed validation; reverted."

      - name: Summary
        if: always()
        run: |
          {
            echo "## Auto-improve outcome"
            echo ""
            echo "- Changes produced: **${{ steps.changed.outputs.changed }}**"
            echo "- Validation: ${{ steps.validate.outputs.validate_fail == '0' && '✅ green' || (steps.changed.outputs.changed == 'true' && '❌ red — reverted' || '⏭️ skipped (no changes)') }}"
            echo "- Pushed: **${{ steps.validate.outputs.validate_fail == '0' && steps.changed.outputs.changed == 'true' && 'yes — ci-desktop/ci-android will re-run and re-release' || 'no' }}**"
          } >> "$GITHUB_STEP_SUMMARY"
