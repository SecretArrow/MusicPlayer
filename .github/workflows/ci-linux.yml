name: CI — Shared audio-core (Linux)

on:
  push:
    branches: [main, master]
    paths:
      - 'shared/audio-core/**'
      - '.github/workflows/ci-linux.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'shared/audio-core/**'
      - '.github/workflows/ci-linux.yml'
  workflow_dispatch:

# Cancel stale in-flight builds for the same ref (branch/tag) on new pushes.
concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test-and-lint:
    name: Test, Lint, Format (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "shared/audio-core"

      - name: Format check
        working-directory: shared/audio-core
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        working-directory: shared/audio-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        working-directory: shared/audio-core
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (default features)
        working-directory: shared/audio-core
        run: cargo build --release --no-default-features --features decoder,metadata,effects

      - name: Test (default features)
        working-directory: shared/audio-core
        run: cargo test --no-default-features --features decoder,metadata,effects --no-fail-fast

      - name: Test (all features including audio_output + uniffi)
        working-directory: shared/audio-core
        run: cargo test --all-features --no-fail-fast

      - name: Build docs
        working-directory: shared/audio-core
        run: cargo doc --no-deps --all-features

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Non-blocking for now: advisories may exist in the dependency tree and
      # shouldn't gate CI until they are triaged. Flip to blocking (remove
      # continue-on-error) once known advisories are resolved.
      - name: Security audit (cargo audit)
        continue-on-error: true
        run: cargo audit
