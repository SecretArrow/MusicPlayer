[package]
name = "musicplayer-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Native desktop music player (Vello + Winit + CPAL)"
license = "MIT"
repository = "https://github.com/SecretArrow/MusicPlayer"
default-run = "musicplayer-desktop"

[dependencies]
audio-core = { path = "../shared/audio-core", features = ["decoder", "metadata", "effects", "audio_output"] }
# Window + event loop
winit = "0.30"
# Native 2D rendering (Vello GPU + CPU fallback)
vello = "0.3"
# Async runtime for the UI thread (Vello needs it)
pollster = "0.4"
# Logging
env_logger = "0.11"
log = "0.4"
# Window/screen info (DPI, multi-monitor)
# (winit provides scale_factor; no extra dep needed)

# Resource embedding (assets bundled into the binary)
include_dir = "0.7"

[build-dependencies]
# No special build steps for now (Vello is a regular Cargo dep).

[[bin]]
name = "musicplayer-desktop"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
