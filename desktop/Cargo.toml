[package]
name = "musicplayer-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Native desktop music player (Vello + Winit + CPAL)"
license = "MIT"
repository = "https://github.com/SecretArrow/MusicPlayer"
default-run = "musicplayer-desktop"

[features]
default = ["audio"]
# CPAL audio output. Requires ALSA dev headers on Linux
# (`sudo apt install libasound2-dev pkg-config`). Disable for UI-only builds:
# `cargo check --no-default-features`
audio = ["audio-core/audio_output"]

[dependencies]
audio-core = { path = "../shared/audio-core", features = ["decoder", "metadata", "effects"] }
# Window + event loop
winit = "0.30"
# Native 2D rendering (Vello GPU + CPU fallback)
vello = "0.3"
# Text layout for Vello
parley = "0.2"
# Async runtime for the UI thread (Vello needs it)
pollster = "0.4"
# Logging
env_logger = "0.11"
log = "0.4"
# Shared mutable state
parking_lot = "0.12"

# Resource embedding (assets bundled into the binary)
include_dir = "0.7"

[[bin]]
name = "musicplayer-desktop"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
